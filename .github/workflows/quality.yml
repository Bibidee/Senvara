name: Source quality
on:
  push:
  pull_request:
env:
  NEXT_PUBLIC_SENVARA_CONTRACT: "0x9668263921d88c1deaB8DA5A416a65D562cB4187"
  NEXT_PUBLIC_SENVARA_RPC: "https://studio.genlayer.com/api"
  SENVARA_GENVM_VERSION: "v0.2.12"
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify local GenLayer CLI
        run: test "$(npx --no-install genlayer --version)" = "0.39.1"
      - name: Source preflight
        run: python scripts/preflight.py
      - name: Verify canonical deployment consistency
        run: npm run verify:deployment
      - name: Verify undeployed v0.2.0 candidate identity
        run: npm run verify:candidate
      - name: Contract behavior model
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install Direct Mode runtime
        run: python -m pip install --requirement requirements-direct.txt
      - name: GenVM lint and schema validation
        run: genvm-lint check contracts/senvara_v02.py --json
      - name: GenVM Direct Mode
        run: python scripts/run-direct-pytest.py tests/test_direct_genvm.py -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build static frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chromium with Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Serve static frontend
        run: |
          node scripts/serve-static.cjs 3000 > browser-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat browser-server.log
          exit 1
      - name: Browser smoke and wallet-provider assertions
        env:
          SENVARA_BASE_URL: http://127.0.0.1:3000
        run: npm run test:browser
      - name: Client primitives
        run: npm run test:client
